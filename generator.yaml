ignore:
  resource_names:
      - AuthenticationProfile
      - ClusterSecurityGroup
      - ClusterSnapshot
      - CustomDomainAssociation
      - EndpointAccess
      - EventSubscription
      - HsmClientCertificate
      - HsmConfiguration
      - Integration
      - Qev2IdcApplication
      - RedshiftIdcApplication
      - ScheduledAction
      - SnapshotCopyGrant
      - SnapshotSchedule
      - UsageLimit
  field_paths:
    - CreateClusterInput.AdditionalInfo
    - CreateClusterInput.AquaConfigurationStatus
    - CreateClusterInput.ClusterSecurityGroups
    - ModifyClusterInput.ClusterSecurityGroups
    - ModifyClusterInput.NewClusterIdentifier
    - Cluster.ClusterSecurityGroups
    - Cluster.AquaConfiguration
resources:
  Cluster:
    renames:
      operations:
        CreateCluster:
          input_fields:
            ClusterIdentifier: Identifier
            ClusterType: Type
            ClusterVersion: Version
          output_fields: &clusterOutputRenames
            ClusterIdentifier: Identifier
            ClusterVersion: Version
            VpcSecurityGroups: VpcSecurityGroupIds
            ClusterStatus: Status
            ClusterAvailabilityStatus: AvailabilityStatus
            ClusterCreateTime: CreateTime
            ClusterNamespaceArn: NamespaceARN
            ClusterNodes: Nodes
            ClusterParameterGroups: ParameterGroups
            ClusterPublicKey: PublicKey
            ClusterRevisionNumber: RevisionNumber
            ClusterSnapshotCopyStatus: SnapshotCopyStatus
        DescribeClusters:
          input_fields:
            ClusterIdentifier: Identifier
          output_fields: *clusterOutputRenames
        ModifyCluster:
          input_fields:
            ClusterIdentifier: Identifier
            ClusterType: Type
            ClusterVersion: Version
          output_fields: *clusterOutputRenames
        DeleteCluster:
          input_fields:
            ClusterIdentifier: Identifier
          output_fields: *clusterOutputRenames
    exceptions:
      errors:
        404:
          code: ClusterNotFound
      terminal_codes:
        - InvalidTagFault
        - TagLimitExceededFault
        - InvalidClusterTrack
    synced:
      when:
        - path: Status.Status
          in:
            - available
    updateable:
      when:
        - path: Status.Status
          in:
            - available
    update_operation:
      omit_unchanged_fields: true
    print:
      add_age_column: true
      add_synced_column: true
      order_by: index
      additional_columns:
        - name: STATUS
          json_path: .status.status
          type: string
          index: 10
    fields:
      Identifier:
        is_primary_key: true
        is_immutable: true
      # Without the override the generator emits the Go-keyword-safe "type_".
      Type:
        go_tag: 'json:"type,omitempty"'
      # renames only reach top-level members, so shorten the nested
      # cluster-prefixed JSON names with go_tag.
      PendingModifiedValues.ClusterIdentifier:
        go_tag: 'json:"identifier,omitempty"'
      PendingModifiedValues.ClusterType:
        go_tag: 'json:"type,omitempty"'
      PendingModifiedValues.ClusterVersion:
        go_tag: 'json:"version,omitempty"'
      ParameterGroups.ClusterParameterStatusList:
        go_tag: 'json:"parameterStatusList,omitempty"'
      MultiAZSecondary.ClusterNodes:
        go_tag: 'json:"nodes,omitempty"'
      MasterUsername:
        is_immutable: true
      MasterUserPassword:
        is_secret: true
      CatalogName:
        is_immutable: true
      LoadSampleData:
        is_immutable: true
      RedshiftIdcApplicationArn:
        is_immutable: true
      DBName:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
      ClusterSubnetGroupName:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
        references:
          resource: ClusterSubnetGroup
          path: Spec.Name
      ClusterParameterGroupName:
        references:
          resource: ClusterParameterGroup
          path: Spec.Name
      NumberOfNodes:
        late_initialize:
          skip_incomplete_check: {}
      Version:
        late_initialize:
          skip_incomplete_check: {}
      AllowVersionUpgrade:
        late_initialize:
          skip_incomplete_check: {}
      AutomatedSnapshotRetentionPeriod:
        late_initialize:
          skip_incomplete_check: {}
      AvailabilityZone:
        late_initialize:
          skip_incomplete_check: {}
      Encrypted:
        late_initialize:
          skip_incomplete_check: {}
      EnhancedVpcRouting:
        late_initialize:
          skip_incomplete_check: {}
      IpAddressType:
        late_initialize:
          skip_incomplete_check: {}
      MaintenanceTrackName:
        late_initialize:
          skip_incomplete_check: {}
      ManualSnapshotRetentionPeriod:
        late_initialize:
          skip_incomplete_check: {}
      PreferredMaintenanceWindow:
        late_initialize:
          skip_incomplete_check: {}
      PubliclyAccessible:
        late_initialize:
          skip_incomplete_check: {}
      # Describe returns these as a string where the Create/Modify input takes a
      # bool, so the read hook recovers them when declared.
      MultiAZ:
        set:
          - ignore: from
      ExtraComputeForAutomaticOptimization:
        set:
          - ignore: from
      AvailabilityZoneRelocation:
        set:
          - ignore: from
      # Key IDs (not ARNs): the SDK documents both members as key IDs, so the
      # references resolve to Status.KeyID rather than the fleet-wide ARN path.
      # Fall back to Status.ACKResourceMetadata.ARN if Describe returns an ARN.
      KmsKeyId:
        late_initialize:
          skip_incomplete_check: {}
        references:
          service_name: kms
          resource: Key
          path: Status.ACKResourceMetadata.ARN
      MasterPasswordSecretKmsKeyId:
        late_initialize:
          skip_incomplete_check: {}
        references:
          service_name: kms
          resource: Key
          path: Status.ACKResourceMetadata.ARN
      ElasticIp:
        references:
          service_name: ec2
          resource: ElasticIPAddress
          path: Status.PublicIP
      VpcSecurityGroupIds:
        set:
          - from: VpcSecurityGroupId
        late_initialize:
          skip_incomplete_check: {}
        references:
          service_name: ec2
          resource: SecurityGroup
          path: Status.ID
      IamRoles:
        set:
          - from: IamRoleArn
        custom_sync: {}
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      DefaultIamRoleArn:
        custom_sync: {}
        late_initialize:
          skip_incomplete_check: {}
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      SnapshotScheduleIdentifier:
        custom_sync: {}
      Tags:
        custom_sync: {}
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/cluster/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/cluster/sdk_read_many_post_set_output.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/cluster/sdk_update_post_build_request.go.tpl
      sdk_update_post_set_output:
        template_path: hooks/cluster/sdk_update_post_set_output.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/cluster/sdk_delete_post_build_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/cluster/sdk_delete_post_request.go.tpl
  ClusterParameterGroup:
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
        set:
          - ignore: from
      Family:
        is_immutable: true
      Description:
        is_immutable: true
        compare:
          is_ignored: true
      ParameterOverrides:
        custom_field:
          map_of: String
      ParameterOverrideStatuses:
        from:
          operation: DescribeClusterParameters
          path: Parameters
        is_read_only: true
    renames:
      operations:
        CreateClusterParameterGroup:
          input_fields:
            ParameterGroupName: Name
            ParameterGroupFamily: Family
        DescribeClusterParameterGroups:
          input_fields:
            ParameterGroupName: Name
          output_fields:
            ParameterGroupFamily: Family
        ModifyClusterParameterGroup:
          input_fields:
            ParameterGroupName: Name
        DeleteClusterParameterGroup:
          input_fields:
            ParameterGroupName: Name
    exceptions:
      errors:
        404:
          code: ClusterParameterGroupNotFound
      terminal_codes:
        - InvalidTagFault
        - TagLimitExceededFault
        - InvalidParameterValue
    update_operation:
      custom_method_name: customUpdateClusterParameterGroup
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/cluster_parameter_group/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/cluster_parameter_group/sdk_read_many_post_set_output.go.tpl
  ClusterSubnetGroup:
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
        set:
          - ignore: from
      SubnetIDs:
        references:
          service_name: ec2
          resource: Subnet
          path: Status.SubnetID
      Tags:
        custom_sync: {}
    renames:
      operations:
        CreateClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
          output_fields:
            SubnetGroupStatus: Status
        DescribeClusterSubnetGroups:
          input_fields:
            ClusterSubnetGroupName: Name
          output_fields:
            SubnetGroupStatus: Status
        ModifyClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
          output_fields:
            SubnetGroupStatus: Status
        DeleteClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
    exceptions:
      errors:
        404:
          code: ClusterSubnetGroupNotFoundFault
      terminal_codes:
        - InvalidSubnet
    hooks:
      sdk_read_many_post_set_output:
        template_path: hooks/cluster_subnet_group/sdk_read_many_post_set_output.go.tpl
